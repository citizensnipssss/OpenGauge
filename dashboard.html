  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080b0e;
    font-family: Arial, sans-serif;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
    background: #0c0f12;
    border-bottom: 1px solid #1a1e22;
    font-size: 11px;
    color: #444;
    flex-shrink: 0;
  }
  header .title { color: #666; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  #dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #222; display: inline-block; margin-right: 5px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  #dot.ok  { background: #00e060; box-shadow: 0 0 6px #00e060; }
  #dot.err { background: #e03030; box-shadow: 0 0 6px #e03030; }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    background: #111;
    padding: 2px;
  }
  .cell {
    background: #080b0e;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .cell pc-gauge { display: block; width: 100%; max-width: 260px; aspect-ratio: 1/1; }
  footer {
    background: #0c0f12;
    border-top: 1px solid #1a1e22;
    padding: 8px 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-shrink: 0;
  }
  .relay-btn {
    background: #111;
    border: 1px solid #2a2e32;
    color: #444;
    padding: 7px 18px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .relay-btn.on { color: #00e060; border-color: #00e060; box-shadow: 0 0 8px #00e0604a; }
  .relay-btn:active { opacity: 0.6; }
